<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saltline">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Saltline — the original single-file FPS generated by Claude Fable 5.2. Playable offline.">
  <title>Saltline</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./game.css">
  <link rel="stylesheet" href="./mobile-shell.css">
</head>
<body>
  <div id="app">
    <canvas id="view" tabindex="0" aria-label="Saltline game view"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-mark">SALTLINE</div>
      <div class="boot-sub" id="boot-msg">Raising the terminal</div>
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <a class="boot-code" href="./" download="saltline.html">Get the full code</a>
    </div>
  </div>
  <div id="rotate-hint" role="status" aria-live="polite">
    <span class="rotate-phone" aria-hidden="true"></span>
    <strong>Rotate your device to landscape</strong>
  </div>
  <script src="./mobile-shell.js"></script>
  <script src="./game.js"></script>
</body>
</html>
